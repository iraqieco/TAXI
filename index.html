<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل السائقين التفاعلي - العراق</title>
    <!-- مكتبة الخرائط Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- نافذة التسجيل الأولية (تظهر عند الدخول لأول مرة) -->
    <div id="registerModal" class="modal">
        <div class="modal-content">
            <h2>مرحباً بك في دليل السائقين</h2>
            <p class="notice">⚠️ تنبيه: البيانات التي ستقوم بإدخالها ستكون عامة ومرئية للجميع لكي يتمكن المستخدمون من الاتصال بك وحجزك هاتفياً.</p>
            <form id="registerForm">
                <input type="text" id="regName" placeholder="الاسم الكامل أو اسم المكتب" required>
                <input type="tel" id="regPhone" placeholder="رقم الجوال (مثلاً: 07700000000)" required>
                <select id="regType" required>
                    <option value="">اختر نوع المركبة</option>
                    <option value="تكسي">تكسي</option>
                    <option value="تكتك">تكتك</option>
                    <option value="دراجة">دراجة نارية</option>
                    <option value="حمل">شاحنة حمل</option>
                </select>
                <input type="text" id="regCity" placeholder="مدينة العمل أو الحي (مثلاً: بعقوبة - التحرير)" required>
                <input type="text" id="regImg" placeholder="رابط صورة السيارة أو الشخص (اختياري)" >
                <button type="submit" class="btn-primary">حفظ والدخول للدليل</button>
            </form>
        </div>
    </div>

    <!-- الواجهة الرئيسية -->
    <div class="app-container">
        <!-- شريط التحكم الجانبي أو العلوي -->
        <header class="app-header">
            <h1>دليل السائقين العراقي</h1>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="ابحث عن مدينة أو حي (عربي / English)...">
            </div>
        </header>

        <!-- الخريطة التفاعلية -->
        <div id="map"></div>

        <!-- قسم تحديد الرحلة وأنواع المركبات -->
        <section class="trip-section">
            <h3>خطط رحلتك</h3>
            <div class="trip-inputs">
                <input type="text" id="startPoint" placeholder="📍 نقطة الانطلاق">
                <input type="text" id="stopPoint" placeholder="⏸️ نقطة توقف (اختياري)">
                <input type="text" id="endPoint" placeholder="🏁 نقطة الوصول">
            </div>
            
            <div class="vehicle-filters">
                <button class="filter-btn active" data-type="all">الكل</button>
                <button class="filter-btn" data-type="تكسي">🚗 تكسي</button>
                <button class="filter-btn" data-type="تكتك">🛺 تكتك</button>
                <button class="filter-btn" data-type="دراجة">🏍️ دراجة</button>
                <button class="filter-btn" data-type="حمل">🚚 حمل</button>
            </div>
        </section>

        <!-- قائمة السائقين المتاحين -->
        <section class="drivers-section">
            <h3>السائقون المتاحون في المنطقة</h3>
            <div id="driversList" class="drivers-grid">
                <!-- يتم تعبئتها ديناميكياً -->
            </div>
        </section>
    </div>

    <!-- نافذة التقييم والإبلاغ -->
    <div id="reviewModal" class="modal hidden">
        <div class="modal-content">
            <h3>تقييم الرحلة أو إبلاغ</h3>
            <form id="reviewForm">
                <p>كيف كانت تجربتك مع السائق؟</p>
                <div class="stars">⭐⭐⭐⭐⭐</div>
                <textarea id="reportText" placeholder="اكتب تقريرك أو ملاحظتك هنا..."></textarea>
                <input type="file" id="reportImage" accept="image/*">
                <div class="modal-buttons">
                    <button type="submit" class="btn-primary">إرسال</button>
                    <button type="button" id="closeReview" class="btn-secondary">إلغاء</button>
                </div>
            </form>
        </div>
    </div>

    <!-- مكتبة الخرائط Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
